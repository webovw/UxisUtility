name: Build APK
​
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
​
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
​
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
​
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
​
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
​
      - name: Download Xray core and geo files
        run: |
          mkdir -p app/libs app/src/main/assets
          curl -fsSL -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar
          curl -fsSL -o app/src/main/assets/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL -o app/src/main/assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          ls -la app/libs app/src/main/assets
​
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/uxis.jks"
          echo "UXIS_KEYSTORE=$RUNNER_TEMP/uxis.jks" >> "$GITHUB_ENV"
​
      - name: Build release APK
        env:
          UXIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UXIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          UXIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
​
      - uses: actions/upload-artifact@v4
        with:
          name: uxis-utility-apk
          path: app/build/outputs/apk/release/*.apk
​
